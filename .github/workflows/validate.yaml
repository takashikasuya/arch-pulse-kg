# REPO-ARCH-PULSE-KG — mono-repo CI
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # 全 CS のトレーサビリティ検証（matrix）
  validate-trace:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cs_path:
          - services/kg-store
          - services/kg-geom
          - services/kg-bim-loader
          - services/kg-net-writer
          - services/graphrag
    steps:
      - uses: actions/checkout@v4
      - name: Checkout parent architecture repo
        uses: actions/checkout@v4
        with:
          repository: takashikasuya/building-os-ecosystem
          token: ${{ secrets.ARCHITECTURE_REPO_READ_TOKEN }}
          path: _architecture
      - name: Install Python deps
        run: pip install pyyaml
      - name: Validate traceability for ${{ matrix.cs_path }}
        run: |
          python _architecture/tools/validate_trace.py \
            --parent _architecture \
            --local ${{ matrix.cs_path }}

  # CS-KG-STORE コンポーネントテスト + 証拠生成
  test-kg-store:
    runs-on: ubuntu-latest
    needs: validate-trace
    defaults:
      run:
        working-directory: services/kg-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install kg-store dependencies
        run: pip install -e ".[dev]"
      - name: Run component tests
        run: |
          PYTHONPATH=src python -m pytest tests/component/ -v \
            --tb=short \
            --junitxml=../../test-results/kg-store-component.xml
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tc-comp-kg-store-002-evidence
          path: services/kg-store/evidence/TC-COMP-KG-STORE-002.json
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kg-store-test-results
          path: test-results/

  # CS-AI-GRAPHRAG コンポーネントテスト + 証拠生成
  test-graphrag:
    runs-on: ubuntu-latest
    needs: validate-trace
    defaults:
      run:
        working-directory: services/graphrag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install graphrag dependencies
        run: pip install -e ".[dev]"
      - name: Run component tests
        run: |
          PYTHONPATH=src python -m pytest tests/component/ -v \
            --tb=short \
            --junitxml=../../test-results/graphrag-component.xml
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tc-comp-ai-graphrag-001-evidence
          path: services/graphrag/evidence/TC-COMP-AI-GRAPHRAG-001.json
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graphrag-test-results
          path: test-results/

  # スタック固有のビルド・テスト（他 CS は実装時に追記）
  build-and-test:
    runs-on: ubuntu-latest
    needs: [validate-trace, test-kg-store, test-graphrag]
    steps:
      - uses: actions/checkout@v4
      # 他 CS のビルド手順はここに追記する

  # Docker イメージビルド + GHCR push（main/develop push 時のみ）
  docker-build-push:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: kg-store
            context: services/kg-store
            image: ghcr.io/takashikasuya/arch-pulse-kg/kg-store
          - service: graphrag
            context: services/graphrag
            image: ghcr.io/takashikasuya/arch-pulse-kg/graphrag
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
