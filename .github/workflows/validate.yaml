# REPO-ARCH-PULSE-KG — mono-repo CI
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # 全 CS のトレーサビリティ検証（matrix）
  validate-trace:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cs_path:
          - services/kg-store
          - services/kg-geom
          - services/kg-bim-loader
          - services/kg-net-writer
          - services/graphrag
    steps:
      - uses: actions/checkout@v4
      - name: Checkout parent architecture repo
        uses: actions/checkout@v4
        with:
          repository: takashikasuya/building-os-ecosystem
          path: _architecture
      - name: Install Python deps
        run: pip install pyyaml
      - name: Validate traceability for ${{ matrix.cs_path }}
        run: |
          python _architecture/tools/validate_trace.py \
            --parent _architecture \
            --local ${{ matrix.cs_path }}

  # CS-KG-STORE コンポーネントテスト + 証拠生成
  test-kg-store:
    runs-on: ubuntu-latest
    needs: validate-trace
    defaults:
      run:
        working-directory: services/kg-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install kg-store dependencies
        run: pip install -e ".[dev]"
      - name: Run component tests
        run: |
          PYTHONPATH=src python -m pytest tests/component/ -v \
            --tb=short \
            --junitxml=../../test-results/kg-store-component.xml
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tc-comp-kg-store-002-evidence
          path: services/kg-store/evidence/TC-COMP-KG-STORE-002.json
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kg-store-test-results
          path: test-results/

  # スタック固有のビルド・テスト（他 CS は実装時に追記）
  build-and-test:
    runs-on: ubuntu-latest
    needs: [validate-trace, test-kg-store]
    steps:
      - uses: actions/checkout@v4
      # 他 CS のビルド手順はここに追記する
