# arch-pulse-kg — local development docker-compose
# Oxigraph runs as a dedicated container so Python↔Oxigraph HTTP boundary
# is established from day 1 (future split costs zero code change).

version: "3.9"

services:

  # ── KG-STORE (Python/FastAPI) ─────────────────────────────────────────────
  kg-store:
    image: ghcr.io/takashikasuya/arch-pulse-kg/kg-store:${VERSION:-dev}
    build: ../services/kg-store
    ports:
      - "8080:8080"
    environment:
      SPARQL_ENDPOINT: "http://kg-store-oxigraph:7878"
      NATS_URL: "nats://nats:4222"
      NATS_STREAM: "bldg"
      LOG_LEVEL: "INFO"
    depends_on:
      kg-store-oxigraph:
        condition: service_started
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Oxigraph (RDF triplestore) ────────────────────────────────────────────
  kg-store-oxigraph:
    image: oxigraph/oxigraph:0.3.22
    volumes:
      - oxigraph-data:/data
    command: serve --location /data --bind 0.0.0.0:7878
    ports:
      - "7878:7878"
    # Oxigraph is a minimal binary without curl/wget; rely on service_started
    # kg-store's OxigraphHttpRepository retries on startup if Oxigraph isn't ready yet

  # ── NATS JetStream ────────────────────────────────────────────────────────
  nats:
    image: nats:2.10
    command: ["--js", "--sd", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data

  # ── KG-GEOM ───────────────────────────────────────────────────────────────
  kg-geom:
    image: ghcr.io/takashikasuya/arch-pulse-kg/kg-geom:${VERSION:-dev}
    # build: ../services/kg-geom

  # ── KG-BIM-LOADER ─────────────────────────────────────────────────────────
  kg-bim-loader:
    image: ghcr.io/takashikasuya/arch-pulse-kg/kg-bim-loader:${VERSION:-dev}
    # build: ../services/kg-bim-loader

  # ── KG-NET-WRITER ─────────────────────────────────────────────────────────
  kg-net-writer:
    image: ghcr.io/takashikasuya/arch-pulse-kg/kg-net-writer:${VERSION:-dev}
    # build: ../services/kg-net-writer

  # ── AI-GRAPHRAG ───────────────────────────────────────────────────────────
  ai-graphrag:
    image: ghcr.io/takashikasuya/arch-pulse-kg/graphrag:${VERSION:-dev}
    build: ../services/graphrag
    ports:
      - "8000:8000"
    environment:
      KG_STORE_URL: "http://kg-store:8080"
      TS_DB_URL: ""       # empty → NullTsReader (degraded mode); set when CS-IN-TS-DB available
      LOG_LEVEL: "INFO"
    depends_on:
      kg-store:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  oxigraph-data:
  nats-data:
