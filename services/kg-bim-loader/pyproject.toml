[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kg-bim-loader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "nats-py>=2.6",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rdflib>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
bim-loader = "kg_bim_loader.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_bim_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
