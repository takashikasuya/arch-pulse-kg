# 親 repo から割り当てられた上位要求 (編集不可 — 親 repo が正本)
upstream_requirements:
  - id: REQ-SOS-026
    title: "BIR を解析正本とし IFC を直接シミュレーションフォーマットに変換しない"
    statement: >
      EnergyPlus IDF / epJSON・OpenFOAM ケース・NavMesh・OccupancyGrid 等の 派生モデルは、IFC から直接変換してはならず、必ず BIR （CS-KG-STORE の意味データ + CS-KG-GEOM のジオメトリペイロード合成ビュー） を経由しなければならない。CS-CT-COMPILER および各シミュレーションエンジンの 入力検証で BIR 経由でないアーティファクトを拒否すること。
    status: approved

  - id: REQ-SOS-028
    title: "bir_id を全システム横断の不変識別子として強制"
    statement: >
      建物の全空間・設備・センサ・アクチュエータは bir_id（URN形式の不変ID）で 参照されなければならない。bir_id は IFC GUID / Revit ElementID / EnergyPlus Zone / 223P PhysicalSpace URI / BAS Point ID prefix / Brick エンティティ URI への双方向マッピングを CS-KG-STORE で保持する。 CS-EA-DEVICE / CS-EA-SPACE 等の Grain 主キー、シミュレーション結果の パラメータ参照、制御記述の Sensor/Actuator URI、ロボットマップの 区画 ID はすべて bir_id 経由で解決されなければならない。
    status: approved

  - id: REQ-SOS-032
    title: "BIR 変更時の差分検出と派生モデル再生成・古い派生モデル参照の拒否"
    statement: >
      CS-KG-STORE / CS-KG-GEOM の BIR が更新された場合、CS-KG-BIM-LOADER は 差分検出（追加・変更・削除されたエンティティの bir_id リスト）を生成し、 影響を受ける派生モデル（EnergyPlus IDF・RC 状態空間・OpenFOAM ケース・ NavMesh・OccupancyGrid・ナビポイントカタログ）の再生成を CS-SM-* / CS-AN-NAV-PLANNER にトリガーしなければならない。 古い派生モデル（ModelVersion < 現行 BIR Version）を参照する 制御アクション・最適化リクエストは PEP-ACTOR / PEP-PHY で拒否される。
    status: approved

