[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kg-geom"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "asyncpg>=0.29",
    "shapely>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kg_geom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
