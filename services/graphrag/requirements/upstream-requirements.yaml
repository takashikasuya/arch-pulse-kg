# 親 repo から割り当てられた上位要求 (編集不可 — 親 repo が正本)
upstream_requirements:
  - id: REQ-SOS-022
    title: "統合AIエネルギーレポートの出典トレーサビリティと改善提案根拠保持"
    statement: >
      エネルギー × 人流 × 設備状態 × 外気条件 × IEQ の多源データを統合した LLMレポート生成は、引用したGrain状態の参照ID・期間・モデル版・ GraphRAG経路（入力ノード→因果リンク→出力ノード）をレポート成果物に 機械可読なメタデータとして付与しなければならない。 改善提案（例：「設定温度+1℃で5%削減」）は、根拠となる過去計測値・ シミュレーションモデル版・期待効果区間（信頼度付き）を含めて保持する。 未引用ノードからの推論や、Grain状態と整合しない数値の生成は拒否される。
    status: approved

  - id: REQ-SOS-023
    title: "ロール別レポート配信時のデータ主権・PII匿名化強制"
    statement: >
      テナント／オーナー／管理者向けレポート配信時、各ロールごとに データ主権ポリシー（PII・Wearableは施設外配信禁止、テナント別データは 他テナントへの開示禁止）と匿名化処理（人流・在室データの個人非識別化）が GovernanceGrainで強制されなければならない。 Push-when-needed（REQ-SOS-009）方針との整合上、ロール別レポート成果物は 生データではなく集計済みAnalyticsとして扱われ、明示承認時のみクラウド配信される。
    status: approved

